services:
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: chat_atlas_local
    hostname: mongodb
    ports:
      - "27018:27017"
    volumes:
      - atlas_db:/data/db
      - atlas_configdb:/data/configdb
      - atlas_mongot:/data/mongot

volumes:
  atlas_db:
  atlas_configdb:
  atlas_mongot: